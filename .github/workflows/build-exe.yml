name: Build Windows exe

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: >
          pyinstaller --onefile --windowed --name autotune
          --collect-all _sounddevice_data
          autotune.py

      - name: Smoke test
        shell: bash
        run: |
          python -c "
          import numpy as np, wave
          sr=48000; t=np.arange(sr)/sr
          x=(0.3*np.sin(2*np.pi*225*t)*32767).astype('<i2')
          f=wave.open('test_in.wav','wb'); f.setnchannels(1); f.setsampwidth(2); f.setframerate(sr); f.writeframes(x.tobytes()); f.close()"
          ./dist/autotune.exe --file test_in.wav test_out.wav
          test -s test_out.wav

      - name: Package
        shell: bash
        run: |
          mkdir -p package
          cp dist/autotune.exe README.md package/
          cd package && 7z a ../autotune-windows.zip *

      - uses: actions/upload-artifact@v4
        with:
          name: autotune-windows
          path: autotune-windows.zip

      - name: Publish release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest autotune-windows.zip dist/autotune.exe \
            --title "Autotune для Windows" \
            --notes "Скачай autotune.exe, установи VB-Audio Virtual Cable и запусти двойным кликом. Подробности в README." \
            --target "$GITHUB_SHA"
