name: Build Windows and macOS apps

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: >
          pyinstaller --onefile --windowed --name autotune
          --icon assets/icon.ico --add-data "assets;assets"
          --collect-all _sounddevice_data
          --collect-all customtkinter
          autotune.py

      - name: Hotkey test (press Ctrl+Alt+A while the shortcut is registered)
        continue-on-error: true
        run: |
          python -c "
          import ctypes, time, autotune as a
          hk = a.GlobalHotkey({'Ctrl', 'Alt'}, 'A'); print('registered:', hk.start(), hk.error)
          u = ctypes.windll.user32
          for vk in (0x11, 0x12, 0x41): u.keybd_event(vk, 0, 0, 0)
          for vk in (0x41, 0x12, 0x11): u.keybd_event(vk, 0, 2, 0)
          time.sleep(1); print('presses:', hk.presses); hk.stop()
          assert hk.presses == 1"

      - name: Smoke test
        shell: bash
        run: |
          python -c "
          import numpy as np, wave
          sr=48000; t=np.arange(sr)/sr
          x=(0.3*np.sin(2*np.pi*225*t)*32767).astype('<i2')
          f=wave.open('test_in.wav','wb'); f.setnchannels(1); f.setsampwidth(2); f.setframerate(sr); f.writeframes(x.tobytes()); f.close()"
          ./dist/autotune.exe --file test_in.wav test_out.wav --talkbox 0.65 --speed 1
          test -s test_out.wav

      - name: Package
        shell: bash
        run: |
          mkdir -p package
          cp dist/autotune.exe README.md package/
          cd package && 7z a ../autotune-windows.zip *

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            autotune-windows.zip
            dist/autotune.exe

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: AppleSilicon
          - runner: macos-15-intel
            arch: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller pillow dmgbuild

      # Our own virtual microphone: BlackHole (GPL-3.0) built under the name "Autotune Mic"
      - name: Build "Autotune Mic" driver
        run: |
          git clone --depth 1 --branch v0.7.2 https://github.com/ExistentialAudio/BlackHole bh
          xcodebuild -project bh/BlackHole.xcodeproj -configuration Release -target BlackHole \
            CONFIGURATION_BUILD_DIR="$PWD/driver-build" \
            PRODUCT_BUNDLE_IDENTIFIER=com.autotune.mic \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            GCC_PREPROCESSOR_DEFINITIONS='$GCC_PREPROCESSOR_DEFINITIONS kDriver_Name=\"Autotune\" kHas_Driver_Name_Format=false kDevice_Name=\"Autotune\ Mic\" kPlugIn_BundleID=\"com.autotune.mic\" kManufacturer_Name=\"Autotune\"' \
            | tail -5
          mv driver-build/BlackHole.driver AutotuneMic.driver
          codesign --verify --verbose AutotuneMic.driver
          lipo -info AutotuneMic.driver/Contents/MacOS/*

      - name: Build app
        run: |
          pyinstaller --windowed --name Autotune --osx-bundle-identifier com.autotune.app \
            --icon assets/icon.png --add-data "assets:assets" \
            --collect-all _sounddevice_data --collect-all customtkinter autotune.py
          APP=dist/Autotune.app
          cp -R AutotuneMic.driver "$APP/Contents/Resources/"
          cp bh/LICENSE "$APP/Contents/Resources/AutotuneMic-driver-LICENSE.txt"
          plutil -insert NSMicrophoneUsageDescription -string \
            "Автотюн обрабатывает звук с микрофона и передаёт его в Discord." \
            "$APP/Contents/Info.plist"
          codesign --force --deep -s - "$APP"
          codesign --verify --deep --verbose "$APP"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" "$APP/Contents/Info.plist"
          ls "$APP/Contents/Resources/"*.icns

      - name: Hotkey test (post Ctrl+Option+A while the shortcut is registered)
        continue-on-error: true
        run: |
          python - <<'PY'
          import ctypes, autotune as a, tkinter as tk
          root = tk.Tk(); root.update()
          hk = a.GlobalHotkey({"Ctrl", "Alt"}, "A"); print("registered:", hk.start(), hk.error)
          q = ctypes.CDLL("/System/Library/Frameworks/ApplicationServices.framework/ApplicationServices")
          q.CGEventCreateKeyboardEvent.restype = ctypes.c_void_p
          q.CGEventCreateKeyboardEvent.argtypes = [ctypes.c_void_p, ctypes.c_uint16, ctypes.c_bool]
          q.CGEventSetFlags.argtypes = [ctypes.c_void_p, ctypes.c_uint64]
          q.CGEventPost.argtypes = [ctypes.c_uint32, ctypes.c_void_p]
          def press():
              for down in (True, False):
                  ev = q.CGEventCreateKeyboardEvent(None, 0x00, down)  # A
                  q.CGEventSetFlags(ev, 0x40000 | 0x80000)  # control | option
                  q.CGEventPost(0, ev)
          root.after(300, press)
          root.after(2000, root.quit)
          root.mainloop()
          print("presses:", hk.presses); hk.stop()
          assert hk.presses == 1
          PY

      - name: Smoke test (audio processing)
        run: |
          python -c "
          import numpy as np, wave
          sr=48000; t=np.arange(sr)/sr
          x=(0.3*np.sin(2*np.pi*225*t)*32767).astype('<i2')
          f=wave.open('test_in.wav','wb'); f.setnchannels(1); f.setsampwidth(2); f.setframerate(sr); f.writeframes(x.tobytes()); f.close()"
          dist/Autotune.app/Contents/MacOS/Autotune --file test_in.wav test_out.wav --talkbox 0.65 --speed 1
          test -s test_out.wav

      - name: Smoke test (install the virtual mic from the app, as on first run)
        run: |
          dist/Autotune.app/Contents/MacOS/Autotune --print-driver-install > install.sh
          cat install.sh
          sudo sh install.sh || true
          for i in $(seq 1 30); do
            if dist/Autotune.app/Contents/MacOS/Autotune --list | tee devices.txt | grep -q "Autotune Mic"; then break; fi
            sleep 2
          done
          cat devices.txt
          grep "Autotune Mic" devices.txt

      - name: Smoke test (sound written to Autotune Mic comes out of it, as Discord hears it)
        run: |
          python - <<'PY'
          import numpy as np, sounddevice as sd
          sr = 48000
          dev = [i for i, d in enumerate(sd.query_devices()) if "Autotune Mic" in d["name"]][0]
          t = np.arange(sr) / sr
          tone = (0.3 * np.sin(2 * np.pi * 440 * t)).astype(np.float32)
          rec = sd.playrec(np.column_stack([tone, tone]), sr, channels=1, device=(dev, dev),
                           dtype="float32", blocking=True)[:, 0]
          seg = rec[sr // 4:]
          peak = np.fft.rfftfreq(len(seg), 1 / sr)[np.argmax(np.abs(np.fft.rfft(seg)))]
          print(f"recorded rms {np.sqrt((seg ** 2).mean()):.3f}, peak {peak:.1f} Hz")
          assert abs(peak - 440) < 2 and seg.std() > 0.05
          PY

      # Classic installer: drag the app onto the Applications folder
      - name: Build DMG
        run: |
          DMG="Autotune-macOS-${{ matrix.arch }}.dmg"
          tiffutil -cathidpicheck assets/dmg_background.png assets/dmg_background@2x.png -out dmg_bg.tiff
          ICNS=$(ls dist/Autotune.app/Contents/Resources/*.icns | head -1)
          dmgbuild -s tools/dmg_settings.py -D app=dist/Autotune.app -D background=dmg_bg.tiff \
            -D icon="$ICNS" "Автотюн" "$DMG"
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/dmg "$DMG"
          ls -la /tmp/dmg /tmp/dmg/.background
          test -L /tmp/dmg/Applications && test "$(readlink /tmp/dmg/Applications)" = /Applications
          test -f /tmp/dmg/.DS_Store
          codesign --verify --deep --verbose /tmp/dmg/Autotune.app
          test -d /tmp/dmg/Autotune.app/Contents/Resources/AutotuneMic.driver
          hdiutil detach /tmp/dmg
          hdiutil imageinfo "$DMG" | grep -E "Format:|Size"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: Autotune-macOS-${{ matrix.arch }}.dmg

  release:
    needs: [windows, macos]
    if: ${{ !cancelled() && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find artifacts -type f
          files=$(find artifacts -type f \( -name '*.zip' -o -name '*.exe' -o -name '*.dmg' \))
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest $files --repo "$GITHUB_REPOSITORY" \
            --title "Автотюн для Discord (Windows и macOS)" \
            --notes "Windows: autotune.exe (нужен бесплатный VB-Audio Virtual Cable, программа предложит установить). macOS: Autotune-macOS-AppleSilicon.dmg (M1–M4) или Autotune-macOS-Intel.dmg — открой и перетащи в «Программы»; со встроенным виртуальным микрофоном «Autotune Mic». Подробности в README." \
            --target "$GITHUB_SHA"
